<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Группа из четырёх сборных: А, Б, В и Г</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071523"/><stop offset="1" stop-color="#102b54"/></linearGradient></defs><style>text{font-family:Arial,sans-serif;fill:#f4f7ff}.lime{fill:#c4ff53}.dim{fill:#90acd0}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}</style><rect width="1200" height="675" rx="28" fill="url(#bg)"/><path d="M40 590H1160M40 595H1160" stroke="#1b5dd4"/><text x="64" y="58" font-size="20" letter-spacing="4" class="dim">QUIZROOM ORIGINAL / МИР 2026</text><path d="M260 180L930 180L930 440L260 440Z M260 180L930 440M930 180L260 440" fill="none" stroke="#4988e7" stroke-width="5"/><g fill="#c4ff53"><circle cx="260" cy="180" r="53"/><circle cx="930" cy="180" r="53"/><circle cx="260" cy="440" r="53"/><circle cx="930" cy="440" r="53"/></g><g text-anchor="middle" font-size="42"><text x="260" y="195" style="fill:#071523">А</text><text x="930" y="195" style="fill:#071523">Б</text><text x="260" y="455" style="fill:#071523">В</text><text x="930" y="455" style="fill:#071523">Г</text></g><text x="600" y="315" font-size="31" text-anchor="middle">КАЖДЫЙ С КАЖДЫМ</text><text x="600" y="540" font-size="28" text-anchor="middle" class="dim">Один круг. Повторных матчей нет.</text><text x="64" y="640" font-size="19" letter-spacing="2" class="dim">СМОТРИ ВНИМАТЕЛЬНО. ОТВЕЧАЙ ТОЧНО.</text></svg>