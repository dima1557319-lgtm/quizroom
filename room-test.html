
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>QuizRoom — Игровая комната</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0920;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      text-align: center;
      background: #17132f;
      border: 1px solid #39305f;
      border-radius: 24px;
      box-shadow: 0 0 40px #8b5cf622;
    }

    h1 {
      font-size: 38px;
      color: #a78bfa;
      margin: 0 0 10px;
    }

    p { color: #b8b4d2; }

    button {
      background: linear-gradient(
        135deg, #8b5cf6, #6366f1
      );
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 16px 24px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #code {
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 8px;
      margin: 18px 0;
    }

    #roomDetails { display: none; }

    #qrcode {
      display: flex;
      justify-content: center;
      padding: 16px;
      background: white;
      border-radius: 16px;
      width: fit-content;
      margin: 20px auto;
    }

    #qrcode img {
      max-width: 100%;
    }

    a {
      color: #a78bfa;
      overflow-wrap: anywhere;
    }

    #status {
      font-size: 14px;
      margin-top: 16px;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>
  <main class="card">
    <h1>QuizRoom</h1>
    <p id="quizSelection">Создай игровую комнату для друзей</p>

    <button id="createBtn">
      Создать комнату
    </button>

    <section id="roomDetails">
      <p>Код комнаты</p>
      <div id="code"></div>

      <div id="qrcode"></div>

      <p>Отсканируйте QR-код телефоном</p>
      <a id="joinLink" href="#">
        Ссылка для подключения игроков
      </a>

      <p>Максимум 20 игроков</p>
      <p><a href="./host.html">Открыть экран ведущего</a></p>
    </section>

    <p id="status" role="status"></p>
    <p><a href="./index.html">← На главную QuizRoom</a></p>
  </main>

  <script type="module">
    import { supabase }
      from "./supabase-client.js";
    import { quizzes, quizIds } from './quiz-catalog.js?v=20261015-15';
    const selectedQuiz = new URLSearchParams(location.search).get('quiz');
    const selectedIndex = quizIds.indexOf(selectedQuiz);
    if(selectedQuiz === 'custom') document.getElementById('quizSelection').textContent='Свой квиз · вопросы и баллы настраиваются перед началом';
    if (selectedIndex >= 0) {
      document.getElementById('quizSelection').textContent = `Квиз «${quizzes[selectedIndex].title}» · Вопросов: ${quizzes[selectedIndex].questions.length}`;
    }

    const button =
      document.getElementById("createBtn");

    const codeElement =
      document.getElementById("code");

    const details =
      document.getElementById("roomDetails");

    const status =
      document.getElementById("status");

    button.addEventListener("click", async () => {
      button.disabled = true;
      details.style.display = "none";
      status.textContent = "Создаём комнату...";

      try {
        if (typeof QRCode === "undefined") {
          throw new Error(
            "Не загрузилась библиотека QR-кодов"
          );
        }

        const { data, error } = await supabase.rpc(
          "create_quiz_room_v2", {p_quiz_key: selectedQuiz === 'custom' ? 'custom' : selectedIndex >= 0 ? selectedQuiz : 'starter'}
        );

        if (error) throw error;

        if (!data || data.length === 0) {
          throw new Error("Сервер не вернул комнату");
        }

        const room = data[0];
        const roomCode = room.room_code;

        if (!/^\d{6}$/.test(roomCode)) {
          throw new Error("Неверный код комнаты");
        }

        // Each tab has one active role.
        for (const key of ['quizroom_player_id','quizroom_player_secret','quizroom_player_room']) sessionStorage.removeItem(key);
        sessionStorage.setItem('quizroom_role','host');
        sessionStorage.setItem(
          "quizroom_host_secret",
          room.host_secret
        );

        sessionStorage.setItem(
          "quizroom_room_code",
          roomCode
        );
        if (selectedIndex >= 0) {
          sessionStorage.setItem(`quizroom_quiz_${roomCode}`, selectedQuiz);
        }

        const joinUrl = new URL(
          "./join.html",
          window.location.href
        );

        joinUrl.searchParams.set(
          "code",
          roomCode
        );

        const qrElement =
          document.getElementById("qrcode");

        qrElement.innerHTML = "";

        new QRCode(qrElement, {
          text: joinUrl.toString(),
          width: 200,
          height: 200,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });

        codeElement.textContent = roomCode;

        const link =
          document.getElementById("joinLink");

        link.href = joinUrl.toString();

        details.style.display = "block";
        status.textContent =
          "Комната успешно создана!";

      } catch (err) {
        status.textContent =
          "Ошибка: " + err.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
