<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Анимированная модель перехода: групповой этап и пять раундов на вылет</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071523"/><stop offset="1" stop-color="#102b54"/></linearGradient></defs><style>text{font-family:Arial,sans-serif;fill:#f4f7ff}.lime{fill:#c4ff53}.dim{fill:#90acd0}@media(prefers-reduced-motion:reduce){.pulse{animation:none}.moving{display:none}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}</style><rect width="1200" height="675" rx="28" fill="url(#bg)"/><path d="M40 590H1160M40 595H1160" stroke="#1b5dd4"/><text x="64" y="58" font-size="20" letter-spacing="4" class="dim">QUIZROOM ORIGINAL / МИР 2026</text><text x="600" y="145" font-size="34" text-anchor="middle">МАРШРУТ К ТИТУЛУ</text><g text-anchor="middle"><rect x="70" y="230" width="280" height="120" rx="18" fill="#153f70"/><text x="210" y="285" font-size="31">ГРУППА</text><text x="210" y="328" font-size="28" class="lime">3 МАТЧА</text><path d="M375 290H455" stroke="#c4ff53" stroke-width="6"/><rect x="490" y="230" width="640" height="120" rx="18" fill="#153f70"/><text x="810" y="285" font-size="31">НА ВЫЛЕТ</text><text x="810" y="328" font-size="28" class="lime">1/16 · 1/8 · 1/4 · 1/2 · ФИНАЛ</text></g><circle class="moving" r="13" fill="#c4ff53"><animateMotion dur="5s" repeatCount="indefinite" path="M100 425 L1100 425"/></circle><path d="M100 425H1100" stroke="#467bc7" stroke-width="3"/><text x="600" y="530" font-size="28" text-anchor="middle" class="dim">Схема условная. Это не видео реального матча.</text><text x="64" y="640" font-size="19" letter-spacing="2" class="dim">СМОТРИ ВНИМАТЕЛЬНО. ОТВЕЧАЙ ТОЧНО.</text></svg>